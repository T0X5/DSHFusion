name: Android CI

# DIV-0006：上游 android.yml 没有声明顶层 permissions，GITHUB_TOKEN 会拿到
# 仓库默认的宽权限。构建任务只需要读源码，因此显式收窄。
# 与契约检查 check-workflows.py 的要求一致（所有工作流必须显式声明权限）。
permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # setup-android@v3 的 packages 默认值是 `tools platform-tools`，
      # 而 `tools` 早已从 SDK 仓库移除：新版 runner（cmdline-tools 16）上
      # `sdkmanager tools` 会直接失败退出，CI 连门禁都跑不到。
      # 这里只让它装仍存在的 platform-tools，其余 SDK 包由下一步手动安装。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept licenses & install SDK packages
        run: |
          sdkmanager --update >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission to scripts
        run: chmod +x gradlew tools/*.sh runtime-bundle/scripts/*.sh runtime-bundle/build_rootfs.sh

      # 需要 python3 跑隐私审计
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1.2.1 (P6)：多语言资源键位/占位符 parity + 源码硬编码 CJK 扫描
      - name: Run i18n consistency check
        run: bash tools/i18n_check.sh

      # v1.3.1：官网资源查询串须与 versionName 同步
      # （GitHub Pages 静态资源 max-age=600，漏改会出现「新 HTML + 旧 JS」）
      #
      # DSHFusion 不导入 website/（见 DIV-0005），因此本步骤正常路径下什么都不检查。
      # 上游版本在这里会打印「官网资源版本号已同步」，而实际上 for 循环里
      # 两个文件都被 `[ -f ] || continue` 跳过了 —— 那是一句谎报。
      # 保留检查逻辑（万一将来重新引入官网仍有门禁），但把跳过说清楚。
      - name: Check website asset version string
        run: |
          if [ ! -d website ]; then
            echo "website/ 未导入 DSHFusion（DIV-0005），本步骤未做任何检查。"
            exit 0
          fi
          APP_VER=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "versionName=$APP_VER"
          for f in website/index.html website/404.html; do
            [ -f "$f" ] || continue
            vers=$(grep -o 'assets/[^"]*?v=[0-9][^"&]*' "$f" | sed 's/.*?v=//' | sort -u)
            if [ -z "$vers" ]; then
              echo "::error file=$f::未发现 ?v= 版本查询串"
              exit 1
            fi
            for v in $vers; do
              if [ "$v" != "$APP_VER" ]; then
                echo "::error file=$f::?v=$v 与 versionName=$APP_VER 不一致"
                exit 1
              fi
            done
          done
          echo "官网资源版本号已同步"

      # 阻断「本机路径/用户名/凭据」随仓库公开
      # （构建文档曾带着开发机 JDK 路径并进入公开仓库）
      - name: Run privacy audit
        run: python3 tools/privacy_audit.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      # 构建可嵌入 APK 的运行环境层（android-side + dsh）。
      #
      # 上游 DSHBox 不把 runtime/ 提交进仓库：它的发布流程在仓库外构建好，
      # 放到 ../../runtime/android-assets，由 app/build.gradle.kts 读取。
      # DSHFusion 的 CI 原先只照搬了 android.yml，**没搬这一步**，
      # 于是 APK 一层都没有 —— 而这不只是「少点东西」：
      # OnlineRuntimeImportManager.prepareAndroidSide() 在缺
      # assets/runtime/android-side.tar.* 时硬失败，且它在**下载之后**才执行，
      # 所以「在线获取运行环境」这条补救路径同样走不通（2026-10-14 真机发现）。
      - name: Build runtime assets
        run: tools/build-runtime-assets.sh

      - name: Assemble debug APK
        env:
          # app/build.gradle.kts:78 读这个变量；不设的话它默认指向
          # ../../runtime/android-assets（仓库的**兄弟**目录），CI 里不存在。
          DSHFUSION_RUNTIME_ASSETS: ${{ github.workspace }}/runtime/android-assets
        run: ./gradlew assembleDebug --stacktrace

      # DIV-0008：核验**产物**的应用身份，而不只是构建配置。
      # 配置写对了不等于打进 APK 的东西对了 —— 中间还有资源合并、资源 ID 分配、
      # 字符串池去重。阶段 1 就踩过：versionCode/versionName 在 gradle 里是
      # 上游的 8 / 1.4.0，配置与产物一致，但两者都错；
      # 而 android:label 是资源引用 0x7f0e001f，不解 resources.arsc 就不知道它
      # 到底解析成什么。这一步把「独立身份」变成对产物的断言。
      - name: Verify APK application identity
        run: python3 tools/check-apk-identity.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
