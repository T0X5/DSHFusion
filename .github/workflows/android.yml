name: Android CI

# DIV-0006：上游 android.yml 没有声明顶层 permissions，GITHUB_TOKEN 会拿到
# 仓库默认的宽权限。构建任务只需要读源码，因此显式收窄。
# 与契约检查 check-workflows.py 的要求一致（所有工作流必须显式声明权限）。
permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # setup-android@v3 的 packages 默认值是 `tools platform-tools`，
      # 而 `tools` 早已从 SDK 仓库移除：新版 runner（cmdline-tools 16）上
      # `sdkmanager tools` 会直接失败退出，CI 连门禁都跑不到。
      # 这里只让它装仍存在的 platform-tools，其余 SDK 包由下一步手动安装。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept licenses & install SDK packages
        run: |
          sdkmanager --update >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Grant execute permission to scripts
        run: chmod +x gradlew tools/*.sh runtime-bundle/scripts/*.sh runtime-bundle/build_rootfs.sh

      # 需要 python3 跑隐私审计
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1.2.1 (P6)：多语言资源键位/占位符 parity + 源码硬编码 CJK 扫描
      - name: Run i18n consistency check
        run: bash tools/i18n_check.sh

      # v1.3.1：官网资源查询串须与 versionName 同步
      # （GitHub Pages 静态资源 max-age=600，漏改会出现「新 HTML + 旧 JS」）
      #
      # DSHFusion 不导入 website/（见 DIV-0005），因此本步骤正常路径下什么都不检查。
      # 上游版本在这里会打印「官网资源版本号已同步」，而实际上 for 循环里
      # 两个文件都被 `[ -f ] || continue` 跳过了 —— 那是一句谎报。
      # 保留检查逻辑（万一将来重新引入官网仍有门禁），但把跳过说清楚。
      - name: Check website asset version string
        run: |
          if [ ! -d website ]; then
            echo "website/ 未导入 DSHFusion（DIV-0005），本步骤未做任何检查。"
            exit 0
          fi
          APP_VER=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "versionName=$APP_VER"
          for f in website/index.html website/404.html; do
            [ -f "$f" ] || continue
            vers=$(grep -o 'assets/[^"]*?v=[0-9][^"&]*' "$f" | sed 's/.*?v=//' | sort -u)
            if [ -z "$vers" ]; then
              echo "::error file=$f::未发现 ?v= 版本查询串"
              exit 1
            fi
            for v in $vers; do
              if [ "$v" != "$APP_VER" ]; then
                echo "::error file=$f::?v=$v 与 versionName=$APP_VER 不一致"
                exit 1
              fi
            done
          done
          echo "官网资源版本号已同步"

      # 阻断「本机路径/用户名/凭据」随仓库公开
      # （构建文档曾带着开发机 JDK 路径并进入公开仓库）
      - name: Run privacy audit
        run: python3 tools/privacy_audit.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 「Run unit tests 通过」**证明不了测试跑过** —— Gradle 对通过的测试不打名字，
      # 所以一个来源目录写错、或 .kt 文件没被收集进去，这一步照样是绿的。
      # 阶段 2.3 就撞上了这个：新增的 7 条 Kotlin 测试（CredentialProjectionCodesTest）
      # **本机跑不了**（没有 kotlinc），而 CI 的绿也不作证它们跑过 ——
      # 等于这批测试**没有任何地方观察到它们运行**。
      # 这一步把「哪些测试类跑了、各跑了多少条」变成日志里的**可见事实**，
      # 并对新测试的存在与条数**判失败**。
      - name: Verify the :backup unit tests actually ran (not just "CI green")
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET

          files = glob.glob("backup/build/test-results/**/*.xml", recursive=True)
          if not files:
              sys.exit("::error:::backup 没有产出任何测试结果 XML —— 测试根本没跑")
          total, classes = 0, {}
          for f in files:
              root = ET.parse(f).getroot()
              classes[root.get("name", "?")] = int(root.get("tests", 0))
              total += int(root.get("tests", 0))
          for name in sorted(classes):
              print(f"  {classes[name]:3d}  {name}")
          print(f":backup 共 {total} 条测试，{len(classes)} 个测试类")

          problems = []
          # 期望值说明（都是**实测**出来的，不是数出来的）：
          # 这个类第一次真跑时报 8 条，而我按阅读数成了 7 条 —— 断言当场红了。
          # 又一次「期望值必须来自真实执行」（docs/INCIDENTS.md 第 22 条）。
          codes = "com.dshbox.app.backup.CredentialProjectionCodesTest"
          if codes not in classes:
              problems.append(f"{codes} 没有运行（本机无 kotlinc，它只可能在这里跑）")
          elif classes[codes] != 8:
              problems.append(f"{codes} 跑了 {classes[codes]} 条，期望 8 条")
          # 下限 = **预期**总数 136，即「不允许净减少」。
          # 推导过程（不是数出来的）：2.5 那轮的 CI 实测是 **124**（Java 81 + Kotlin 43），
          # 已被逐类打印证实（18 个类）。
          # 本轮（2.6，导出路径）新增：
          #      + 14（我们的 DshBackupExporterTest —— 导出编排的本机测试）
          #      + 13（我们的 DshRestoreOrchestratorTest —— **恢复编排**的本机测试：
          #            端到端恢复、预检不碰数据（逐文件摘要）、TARGET_CHANGED 接线、
          #            状态机拒绝乱序、以及五条负路径）
          #      + 11（我们的 DshAutomaticBackupRunnerTest —— 自动备份的**顺序**：
          #            导出失败时一份旧备份都不许少；读不了的归档不删也不计数）
          #   = 120；Kotlin 侧未动仍是 43 ⇒ 120 + 43 = 163。
          # 119 是本机实测（tools/run-backup-jvm-tests.sh，17 个类），43 是 CI 实测。
          # 拼出来的 162 仍然是**推断**，所以它的第一次真跑必须能证伪它 ——
          # 若 CI 报的不是 162，先信 CI（docs/INCIDENTS.md 第 27 条）。
          if total < 163:
              problems.append(f":backup 只有 {total} 条测试，低于本轮预期总数 163")
          # 2.4 的恢复核心是**会毁数据**的那条路径，所以单独钉住它的类。
          # 「总数够了」不代表「新那 8 条在里面」（第 26 条的同族）。
          restore = "com.deepseekharness.app.backup.NativeRestorePlanTest"
          if restore not in classes:
              problems.append(f"{restore} 没有运行（恢复核心的测试没跑 = 2.4 没有证据）")
          elif classes[restore] != 8:
              problems.append(f"{restore} 跑了 {classes[restore]} 条，期望 8 条")
          # 2.4b 的落点映射同样是会毁数据的那条路径（它决定往哪写），单独钉住。
          # 尤其要钉住「端到端往返」与「活动目录被改动就拒绝」这两条用例都在。
          mapping = "com.dshbox.app.backup.HostRestoreMappingTest"
          if mapping not in classes:
              problems.append(f"{mapping} 没有运行（落点映射没跑 = 2.4b 没有证据）")
          elif classes[mapping] != 11:
              problems.append(f"{mapping} 跑了 {classes[mapping]} 条，期望 11 条")
          # 2.4b-② 的提交/回切是最危险的一段（它真的动活动目录）。**两个类都要钉**：
          # 上游那个证明事务本身严密（含真杀子进程），我们那个证明「接得上」——
          # 只钉一个的话，另一个可以静默消失而总数仍然够。
          # 2.5 的三个类。前两个是**逐字节导入**的上游测试 ——
          # 「导入的源码能编过」不等于「导入的测试真的跑了」，所以要分别钉。
          # 第三个里有一条是审计结论的**可证伪形式**：它证明「直接抄上游 pruner
          # 会静默变成空操作」不是一句说法，而是一个会红的实验（事故表第 28 条）。
          for name, want, why in (
              ("com.deepseekharness.app.backup.HostDataTransactionTest", 5,
               "上游的事务测试没跑 = 提交/回切的严密性没有证据"),
              ("com.dshbox.app.backup.HostRestoreTransactionTest", 8,
               "我们的适配层集成测试没跑 = 「上游事务接得上我们的计划」没有证据"),
              ("com.dshbox.app.backup.DshHostPathsTest", 5,
               "路径规范化没跑 = 真机上导出会以 PARENT_LINK 失败，而那是"
               "「符号链接没被解析」的**唯一**症状"),
              ("com.dshbox.app.backup.DshAutomaticBackupRunnerTest", 11,
               "自动备份的**顺序**守卫没跑 = 「导出失败时不会净损失旧备份」没有证据"),
              ("com.dshbox.app.backup.DshRestoreOrchestratorTest", 14,
               "恢复编排是本模块**会毁数据**的那条路径；「预检不碰数据」由摘要证明，"
               "且**三种坏归档都必须有具名错误码**（验收标准写的是「明确报错」）"),
              ("com.dshbox.app.backup.DshBackupExporterTest", 15,
               "导出编排是本模块第三段会泄数据的路径；且「排除谓词的坐标系要拼前缀」"
               "少一步就**静默带走机器本地凭据**"),
              ("com.deepseekharness.app.util.AutomaticBackupPolicyTest", 4,
               "导入的到期判定测试没跑 = 「计划什么时候该备份」没有证据"),
              ("com.deepseekharness.app.util.ScheduledBackupOwnerTest", 5,
               "导入的单飞票据测试没跑 = 「过期请求不会覆盖新设置」没有证据"),
              ("com.dshbox.app.backup.DshAutomaticBackupRetentionTest", 7,
               "保留策略测试没跑 = 「只保留 3 份」没有证据，且审计结论失去可证伪形式"),
          ):
              if name not in classes:
                  problems.append(f"{name} 没有运行（{why}）")
              elif classes[name] != want:
                  problems.append(f"{name} 跑了 {classes[name]} 条，期望 {want} 条")
          if problems:
              sys.exit("::error::" + "；".join(problems))
          print(":backup 的测试确实跑了，且新测试在位。")
          PY

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      # 构建可嵌入 APK 的运行环境层（android-side + dsh）。
      #
      # 上游 DSHBox 不把 runtime/ 提交进仓库：它的发布流程在仓库外构建好，
      # 放到 ../../runtime/android-assets，由 app/build.gradle.kts 读取。
      # DSHFusion 的 CI 原先只照搬了 android.yml，**没搬这一步**，
      # 于是 APK 一层都没有 —— 而这不只是「少点东西」：
      # OnlineRuntimeImportManager.prepareAndroidSide() 在缺
      # assets/runtime/android-side.tar.* 时硬失败，且它在**下载之后**才执行，
      # 所以「在线获取运行环境」这条补救路径同样走不通（2026-10-14 真机发现）。
      - name: Build runtime assets
        run: tools/build-runtime-assets.sh

      # DIV-0017：用**固定的**签名密钥库，而不是 AGP 每次现生成的调试密钥库。
      #
      # 真机实测（2026-10-14）：四个不同 CI 运行的产物，签名公钥两两不同 ——
      # 于是新构建**装不到旧构建上面**（INSTALL_FAILED_UPDATE_INCOMPATIBLE），
      # 每出一个构建都得卸载重装，连带丢掉已下好的运行环境层。
      # 对一个「长期自用、持续吸收上游」的项目来说，这个代价不能接受。
      #
      # 密钥放在 Actions Secret 里，**不提交进仓库** —— 上游 .gitignore 写着
      # 「签名密钥：绝不入库」，那条规定是有道理的，不需要为这件事破例。
      #
      # Secret 缺失时这一步直接失败，**不静默退回调试密钥**：
      # 静默退回会让「签名稳定」变成一句没人能验证的话，而下次真机安装失败时
      # 你会以为是别的原因。同理，指纹对不上也判失败。
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DSHFUSION_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DSHFUSION_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::缺少 secret DSHFUSION_KEYSTORE_B64 / DSHFUSION_KEYSTORE_PASSWORD —— 拒绝用随机调试密钥签名"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | base64 -d > signing/dshfusion.jks
          {
            echo "storeFile=../signing/dshfusion.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=dshfusion"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

          EXPECTED=76d588d44aad12b00aac0a1587738bc91efc182b7c0b00b288a5826058e98126
          ACTUAL=$(keytool -list -v -keystore signing/dshfusion.jks \
                     -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
                   | grep -oE '([0-9A-F]{2}:){31}[0-9A-F]{2}' | head -1 \
                   | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::密钥库指纹不符：期望 $EXPECTED，实际 ${ACTUAL:-<解不出>}"
            echo "::error::secret 里的密钥库不是这个应用的身份。签名变了会让已装的版本无法覆盖升级。"
            exit 1
          fi
          echo "签名密钥库已就位，证书 SHA-256 = $ACTUAL"

      - name: Assemble debug APK
        env:
          # app/build.gradle.kts:78 读这个变量；不设的话它默认指向
          # ../../runtime/android-assets（仓库的**兄弟**目录），CI 里不存在。
          DSHFUSION_RUNTIME_ASSETS: ${{ github.workspace }}/runtime/android-assets
        run: ./gradlew assembleDebug --stacktrace

      # DIV-0008：核验**产物**的应用身份，而不只是构建配置。
      # 配置写对了不等于打进 APK 的东西对了 —— 中间还有资源合并、资源 ID 分配、
      # 字符串池去重。阶段 1 就踩过：versionCode/versionName 在 gradle 里是
      # 上游的 8 / 1.4.0，配置与产物一致，但两者都错；
      # 而 android:label 是资源引用 0x7f0e001f，不解 resources.arsc 就不知道它
      # 到底解析成什么。这一步把「独立身份」变成对产物的断言。
      - name: Verify APK application identity
        run: python3 tools/check-apk-identity.py app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dshapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
