name: Upstream watch

# 定期检查两个上游是否有新提交，并生成变更摘要。
#
# 设计原则：本工作流**只报告，不改主干**。它产出摘要与冲突预警，
# 由人决定是否同步（见 docs/UPSTREAM-SYNC.md）。
# 低风险变更可以后续开启自动候选 PR，但默认关闭。
#
# Issue 去重策略（重要）：
#   标题**不含日期**，是稳定的固定字符串。每周运行若发现上游仍有未集成的提交，
#   就**往同一个 issue 追加一条评论**，而不是新建 issue。
#   只有当不存在同名 open issue 时才创建。
#   原因：上游提交可能几周都不处理，带日期的标题会每周制造一个新 issue，
#   把真正需要关注的信号淹没在重复通知里。

on:
  schedule:
    # 每周一 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      upstream:
        description: '要检查的上游（dshbox / dsha / both）'
        required: false
        default: both
        type: choice
        options: [both, dshbox, dsha]

permissions:
  contents: read
  issues: write

concurrency:
  # 同一时间只跑一个，避免两次运行同时判定"没有已有 issue"而各建一个
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'

      - name: Clone upstream mirrors
        run: |
          set -euo pipefail
          mkdir -p ../upstream-mirrors
          git clone --mirror https://github.com/WSK-build/DSHBox.git ../upstream-mirrors/DSHBox.git
          git clone --mirror https://github.com/DSH-APP/DSHA.git   ../upstream-mirrors/DSHA.git
          du -sh ../upstream-mirrors/*

      - name: Generate upstream change summaries
        id: summaries
        run: |
          set -euo pipefail
          target="${{ github.event.inputs.upstream || 'both' }}"
          if [ "$target" = "both" ] || [ "$target" = "dshbox" ]; then
            echo "::group::DSHBox"
            tools/sync-upstream.sh dshbox --report || true
            echo "::endgroup::"
          fi
          if [ "$target" = "both" ] || [ "$target" = "dsha" ]; then
            echo "::group::DSHA"
            tools/sync-upstream.sh dsha --report || true
            echo "::endgroup::"
          fi

          # 新增或修改的摘要文件 = 上游有新提交
          changed_files="$(git status --porcelain docs/upstream-reports/ 2>/dev/null || true)"
          if [ -n "$changed_files" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "files<<SUMMARIES_EOF"
            printf '%s\n' "$changed_files"
            echo "SUMMARIES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-change-summaries
          path: docs/upstream-reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Report to a single tracking issue (deduplicated)
        if: steps.summaries.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_FILES: ${{ steps.summaries.outputs.files }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # 稳定标题：不含日期。带日期的标题会每周制造一个新 issue。
          title="上游有新提交需要评估"

          {
            echo "本次检查发现上游有新提交（${{ github.event_name }}，$(date -u +%Y-%m-%dT%H:%MZ)）。"
            echo
            echo "运行记录：${RUN_URL}"
            echo
            echo "本次新增/更新的摘要文件："
            echo
            printf '%s\n' "$CHANGED_FILES" | sed '/^$/d' | sed 's/^/    /'
            echo
            echo "摘要全文见本次运行的 artifact \`upstream-change-summaries\`。"
            echo
            echo "处理流程见 \`docs/UPSTREAM-SYNC.md\`。重点看摘要里的："
            echo
            echo "- **§3 冲突预警** —— 变更文件与已登记偏离的交集，这些必须人工重放"
            echo "- **§4 测试基线变化** —— \`@Test\` 方法数净减少要查明原因"
            echo "- **§5 许可与依赖变化** —— 任一变化都要求人工确认"
            echo
            echo "> 构建或测试失败时**保留现有稳定主干，不要合并**。"
            echo "> 集成完成后用 \`tools/sync-upstream.sh <上游> --record <提交>\` 推进锁定提交，"
            echo "> 该命令会校验审核记录，并关闭本 issue 的对应条目。"
          } > /tmp/upstream-report.md

          # 查找已存在的同名 open issue（标题精确匹配，避免前缀误命中）
          # 用 --arg 传标题，避免 jq 表达式里嵌套引号
          existing="$(gh issue list \
            --state open \
            --search "in:title $title" \
            --limit 50 \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" \
            2>/dev/null | head -1 || true)"

          if [ -n "$existing" ]; then
            echo "==> 已有跟踪 issue #$existing，追加评论（不新建）"
            gh issue comment "$existing" --body-file /tmp/upstream-report.md
          else
            echo "==> 没有已存在的跟踪 issue，新建一个"
            url="$(gh issue create --title "$title" --body-file /tmp/upstream-report.md)" \
              || { echo "NOTE: 无法创建 issue（可能未开启 issues）。摘要已作为 artifact 上传。"; exit 0; }
            echo "已创建：$url"
          fi
