name: Contracts

# 阶段 0 的 CI：校验治理文件的内部一致性与真实文件存在性。
# 不构建 Android —— 上游代码尚未导入（见 AGENTS.md「当前处于什么阶段」）。
# 阶段 1 导入源码后，本工作流会增加 Gradle 单测与 Lint 步骤。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Governance contract checks
        run: python3 tools/check-upstreams.py

      - name: Validate workflow YAML (PyYAML)
        run: python3 tools/check-workflows.py

      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.7
          arch="$(uname -m)"
          case "$arch" in
            x86_64)  goarch=amd64 ;;
            aarch64) goarch=arm64 ;;
            *) echo "::error::不支持的架构 $arch"; exit 1 ;;
          esac
          curl -sSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_${goarch}.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Lint workflows with actionlint (incl. shellcheck)
        run: actionlint -no-color .github/workflows/*.yml

      - name: Reference integrity (links and repo paths)
        run: python3 tools/check-references.py

      - name: Upstream license originals unchanged
        run: python3 tools/check-license-hashes.py

      - name: All JSON files parse
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$file"; then
              echo "::error file=$file::JSON 解析失败"
              failed=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*')
          exit "$failed"

      - name: Shell scripts pass syntax check
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            if ! bash -n "$file"; then
              echo "::error file=$file::bash 语法错误"
              failed=1
            fi
          done < <(find tools -name '*.sh')
          exit "$failed"

      - name: Shell scripts are executable
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            if [ ! -x "$file" ]; then
              echo "::error file=$file::缺少可执行位"
              failed=1
            fi
          done < <(find tools -name '*.sh')
          exit "$failed"

      - name: Python tools compile
        run: python3 -m compileall -q tools

      - name: No new shellcheck findings beyond inherited baseline
        run: python3 tools/check-lint-baseline.py

      - name: Import fidelity vs upstream (only in this workspace)
        run: |
          set -euo pipefail
          # 逐 blob 对照上游需要上游审计副本，CI 里没有，因此自动跳过。
          # 本工作区（有 ../audit/DSHBox）里会真正比对。
          python3 tools/check-import-fidelity.py

      - name: Verify upstream mirrors are NOT tracked
        run: |
          set -euo pipefail
          # 上游镜像是上百 MB 的对象库，绝不能进 git。
          if git ls-files | grep -qE 'upstream-mirrors/|\.git/objects'; then
            echo "::error::上游镜像被误提交进仓库"
            exit 1
          fi
          # 运行环境大资产同样不提交。
          if git ls-files | grep -qE 'runtime/android-assets|\.tar\.zst$|\.tar\.gz$|offline-rootfs'; then
            echo "::error::运行环境大资产被误提交进仓库"
            exit 1
          fi
          echo "无镜像与大资产入库。"

      - name: Phase 0 verification suite (success and failure paths)
        run: bash tools/verify-phase0.sh

      - name: Brand assets are our own, not upstream's
        run: |
          set -euo pipefail
          # DSHBox 的 TRADEMARK.md 保留其品牌图形全部权利，并禁止使用其设计构造方法。
          # 阶段 1 起仓库里有 8 个自有品牌图形，必须证明它们出自本项目生成器。
          #
          # 这里不是「找找有没有图片」那种只会打印的弱检查 —— 它重跑生成器，
          # 与磁盘上的文件逐字节比对。上游图形不可能通过。
          if ! find app/src/main/res -name '*.png' | grep -q .; then
            echo "阶段 1 尚未导入上游源码，跳过品牌图形核验。"
            exit 0
          fi
          python3 tools/make-brand-assets.py --check
